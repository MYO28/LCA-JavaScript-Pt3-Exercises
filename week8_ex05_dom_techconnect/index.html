<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechConnect: Developer Community Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
      <div class="container">
        <span class="navbar-brand mb-0 h1 fw-bold text-info">TechConnect Hub</span>
      </div>
    </nav>

    <div class="container mb-5">
      <div class="row g-3 align-items-center justify-content-between mb-4 bg-white p-3 rounded shadow-sm">
        <div class="col-md-4">
          <input type="text" id="searchBar" class="form-control" placeholder="Search by name, role, or skill..." />
        </div>
        <div class="col-md-4 text-md-center">
          <span class="fs-5 fw-semibold">Showing <span id="devCounter" class="badge bg-info text-dark">0</span> Developers</span>
        </div>
        <div class="col-md-4 text-md-end d-flex gap-2 justify-content-md-end">
          <button id="toggleViewBtn" class="btn btn-outline-secondary">Show Table View</button>
          <button class="btn btn-info fw-semibold" data-bs-toggle="modal" data-bs-target="#addDevModal">Add Developer</button>
        </div>
      </div>

      <div id="cardView" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>

      <div id="tableView" class="table-responsive d-none bg-white p-3 rounded shadow-sm">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Avatar</th>
              <th>Name</th>
              <th>Role</th>
              <th>Location</th>
              <th>Skills</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="modal fade" id="addDevModal" tabindex="-1" aria-labelledby="addDevModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title" id="addDevModalLabel">Register New Developer</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="addDevForm" novalidate>
            <div class="modal-body">
              <div class="mb-3">
                <label for="devName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="devName" required />
                <div class="invalid-feedback">Please enter a name.</div>
              </div>
              <div class="mb-3">
                <label for="devRole" class="form-label">Role / Specialization</label>
                <select class="form-select" id="devRole" required>
                  <option value="">Select a role...</option>
                  <option value="Frontend Developer">Frontend Developer</option>
                  <option value="Backend Developer">Backend Developer</option>
                  <option value="Full Stack Developer">Full Stack Developer</option>
                  <option value="UI/UX Designer">UI/UX Designer</option>
                  <option value="DevOps Engineer">DevOps Engineer</option>
                </select>
                <div class="invalid-feedback">Please select a professional role.</div>
              </div>
              <div class="mb-3">
                <label for="devLocation" class="form-label">Location</label>
                <input type="text" class="form-control" id="devLocation" required />
                <div class="invalid-feedback">Please specify a city location.</div>
              </div>
              <div class="mb-3">
                <label for="devSkills" class="form-label">Skills (Comma separated)</label>
                <input type="text" class="form-control" id="devSkills" placeholder="e.g. HTML, CSS, JavaScript" required />
                <div class="invalid-feedback">Please list at least one skill.</div>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="devAvailable" checked />
                <label class="form-check-label" for="devAvailable">Available For Hire</label>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-info fw-semibold">Save Profile</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
